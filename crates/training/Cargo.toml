[package]
name = "training"
version = "0.1.1"
edition = "2024"
authors = ["hahanguyx"]

[dependencies]
structure-core = { path = "../structure-core" }
candle-core = { version = "0.10.2", features = ["metal"] }
candle-nn = "0.10.2"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Logger
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
